<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Costos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="font-sans max-w-[500px] mx-auto my-10 px-5 bg-[#faf7f2] text-[#333]">

<section class="pt-10">
    <h1 class="text-xl font-bold mb-1">Calculadora de Costos</h1>
    <p class="text-gray-500 mt-0 mb-5">Agrega los ingredientes y sus costos para calcular el costo total de tu receta</p>
</section>

<form id="formIngrediente" class="bg-white p-4 rounded-lg shadow-md flex flex-col gap-2.5">
    <div>
        <label for="nombre" class="text-sm text-gray-600">Nombre del Ingrediente:</label>
        <input type="text" id="nombre" placeholder="Ej. Harina Integral" required class="w-full p-2 border border-gray-300 rounded text-base">
    </div>
    <div>
        <label for="costoPorKilo" class="text-sm text-gray-600">Costo por kilo ($)</label>
        <input type="number" id="costoPorKilo" placeholder="Ej: 1000" min="0" step="0.01" required class="w-full p-2 border border-gray-300 rounded text-base">
    </div>
    <div>
        <label for="cantidadReceta" class="text-sm text-gray-600">Cantidad usada (gramos)</label>
        <input type="number" id="cantidadReceta" placeholder="Ej: 150" min="0" required class="w-full p-2 border border-gray-300 rounded text-base">
    </div>
    <button type="submit"class="bg-[#b5651d] hover:bg-[#944f16] text-white border-none py-2.5 rounded text-base cursor-pointer mt-1.5">Agregar ingrediente</button>
</form>

<table class="w-full mt-6 border-collapse bg-white shadow-md"> 
    <thead>
        <tr>
            <th class="p-2 px-2 text-left border-b border-gray-200 text-sm bg-[#f0ece5]">Ingrediente</th>
            <th class="p-2 px-2 text-left border-b border-gray-200 text-sm bg-[#f0ece5]">Gramos</th>
            <th class="p-2 px-2 text-left border-b border-gray-200 text-sm bg-[#f0ece5]">Costo</th>
            <th class="p-2 px-2 text-left border-b border-gray-200 text-sm bg-[#f0ece5]"></th>
        </tr>
    </thead>
    <tbody id="cuerpoTabla"></tbody>
</table>

<div class="total mt-4 text-xl font-bold text-right" id="totalPlato">Total: $0.00</div>

<script src="main.js"></script>

</body>
</html>
